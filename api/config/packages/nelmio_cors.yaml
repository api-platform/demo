nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        allow_headers: ['Content-Type', 'Authorization', 'Preload', 'Fields', 'Mcp-Session-Id', 'Mcp-Protocol-Version']
        expose_headers: ['Link', 'Mcp-Session-Id', 'WWW-Authenticate']
        max_age: 3600
    paths:
        # Browser-based MCP clients (e.g. MCP Inspector) discover the authorization server from any origin
        '^/\.well-known/oauth-protected-resource':
            origin_regex: false
            allow_origin: ['*']
            allow_methods: ['GET']
        '^/': null
