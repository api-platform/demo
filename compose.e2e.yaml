services:
  mock-openlibrary:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./e2e:/app
    command: sh -c "apk add --no-cache openssl && cd mock-server && node server.js"
    networks:
      default:
        aliases:
          - openlibrary.org
          - covers.openlibrary.org
          - gutendex.com

  php:
    volumes:
      - ./e2e/mock-server:/mock-certs:ro
    environment:
      # Trust mock server's self-signed cert for gutendex.com / openlibrary.org
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates-with-mock.crt
    entrypoint: ["/bin/sh", "-c", "while [ ! -f /mock-certs/cert.pem ]; do sleep 0.1; done && cat /etc/ssl/certs/ca-certificates.crt /mock-certs/cert.pem > /etc/ssl/certs/ca-certificates-with-mock.crt && exec docker-entrypoint \"$$@\"", "--"]
    depends_on:
      - mock-openlibrary

  pwa:
    environment:
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    depends_on:
      - mock-openlibrary

  keycloak:
    command: start-dev --import-realm
    environment:
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/certs/tls.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/certs/tls.key
    volumes:
      - ./helm/api-platform/keycloak/certs/tls.crt:/opt/keycloak/certs/tls.crt:ro
      - ./helm/api-platform/keycloak/certs/tls.pem:/opt/keycloak/certs/tls.key:ro
      - ./helm/api-platform/keycloak/config:/opt/keycloak/data/import
