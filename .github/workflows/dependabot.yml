# yaml-language-server: $schema=https://github.com/SchemaStore/schemastore/blob/master/src/schemas/json/github-workflow.json
name: Auto-merge Dependabot PRs

on:
  pull_request_target:
    branches:
      - "4.3"

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      contains(github.event.pull_request.labels.*.name, 'dependencies') &&
      (
        contains(github.event.pull_request.labels.*.name, 'semver-patch') ||
        contains(github.event.pull_request.labels.*.name, 'npm: patch-update') ||
        contains(github.event.pull_request.labels.*.name, 'composer: patch-update')
      )
    steps:
      - name: Enable auto-merge
        run: gh pr merge --auto --rebase "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
